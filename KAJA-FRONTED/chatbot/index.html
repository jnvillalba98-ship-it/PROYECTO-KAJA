<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asistente KAJA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="chatbot-button" aria-label="Abrir Asistente KAJA">
    💬
</button>

<div class="chat-container" id="chatbot-container">

       <header class="chat-header">

    <div class="bot-avatar">
        <img src="assets/logo_kaja.png" alt="Logo KAJA" class="bot-logo">
    </div>

    <div>
        <h1>Asistente KAJA</h1>
        <span>● En línea</span>
    </div>

    <button class="chat-close" id="chat-close">×</button>

</header>

        </header>


        <main class="chat-messages" id="chatMessages">

            <div class="message bot">
                <div class="message-content">
                    Hola 👋 Soy el asistente virtual de <strong>KAJA</strong>.
                    <br><br>
                    Puedo ayudarte con información sobre inventario,
                    productos, ventas, usuarios y funcionamiento del sistema.
                </div>
            </div>

        </main>


        <div class="quick-options">

            <button onclick="quickQuestion('¿Qué es KAJA?')">
                ¿Qué es KAJA?
            </button>

            <button onclick="quickQuestion('¿Qué hace el inventario?')">
                Inventario
            </button>

            <button onclick="quickQuestion('¿Qué puede hacer un administrador?')">
                Administrador
            </button>

            <button onclick="quickQuestion('¿Qué tecnologías utiliza KAJA?')">
                Tecnologías
            </button>

        </div>


        <footer class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Escribe tu pregunta..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Enviar
            </button>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
